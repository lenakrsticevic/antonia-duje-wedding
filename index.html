<!doctype html>
<html lang="hr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Antonia i Duje</title>

    <link rel="stylesheet" href="styles.css" />
    <meta property="og:title" content="Antonia i Duje – 13. lipnja 2026." />
    <meta property="og:description" content="Pozivamo vas da s nama podijelite radost našeg vjenčanja." />
    <meta property="og:image" content="https://tvoj-domena.vercel.app/assets/invite-front.webp" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

</head>

<body>

    <header class="hero">
        <div class="card" id="card">
            <div class="card__inner">
                <div class="card__face card__face--front">
                    <img src="assets/invite-front.webp" alt="">
                </div>
                <div class="card__face card__face--back">
                    <img src="assets/invite-back.webp" alt="">
                </div>
            </div>
        </div>

        <button id="openBtn" class="btn">Otvori pozivnicu</button>
    </header>

    <section class="form-section">
        <h2>Potvrda dolaska</h2>

        <form id="rsvp-form">

            <div class="field">
                <label>Prezime obitelji</label>
                <input type="text" name="familyName" required>
            </div>

            <div class="field">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="nije obavezno ako unosite mobitel">
            </div>

            <div class="field">
                <label>Broj mobitela</label>
                <input type="tel" name="phone" placeholder="nije obavezno ako unosite e-mail">
            </div>

            <div class="field">
                <label>Dolazite li?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="attending" value="DA" required>
                        <span>Da, dolazimo</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attending" value="NE" required>
                        <span>Nažalost ne dolazimo</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <label>Članovi obitelji</label>
                <div id="members-container">
                    <div class="member-row">
                        <input type="text" name="memberNames[]" placeholder="Ime i prezime">
                    </div>
                </div>
                <button type="button" id="add-member" class="btn">Dodaj člana</button>
            </div>

            <button type="submit" class="btn">Pošalji potvrdu</button>

            <p id="msg" class="message"></p>

        </form>

    </section>

    <script src="main.js"></script>
    <!-- FULLSCREEN VIEWER -->
    <div id="viewer" class="viewer">
        <button id="closeViewer" class="viewer-close">✕</button>
        <img id="viewer-img" src="" alt="">
        <button id="nextSlide" class="viewer-next">›</button>
    </div>

</body>

</html>
